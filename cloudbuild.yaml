# Optional Cloud Build deploy. Prefer ./deploy.sh -cloud (local Docker, no Cloud Build).
# Usage: gcloud builds submit --config=cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: user-management-app
  _REPO: user-management

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '--provenance=false'
      - '--sbom=false'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--cpu-throttling'
      - '--timeout=60'
      - '--clear-cloudsql-instances'
      - '--set-env-vars'
      - 'USE_SQLITE=1,SQLITE_DB=/tmp/users.db'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}'

options:
  logging: CLOUD_LOGGING_ONLY
